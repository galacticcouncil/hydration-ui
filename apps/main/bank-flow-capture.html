<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><script>history.replaceState(null,"","/portfolio?depositStatus=all&category=assets"+location.hash);let stage=0;const captureSetup=setInterval(()=>{const dialog=document.querySelector('[role="dialog"]');const nodes=stage===0?[...document.querySelectorAll("button")]:[...document.querySelectorAll('button,[role="tab"]')];const tests=[n=>n.textContent.trim()==="Deposit",n=>n.textContent.trim().startsWith("Bank transfer"),n=>n.textContent.trim()==="Version 2",n=>n.textContent.trim()==="Continue"&&dialog?.contains(n),n=>n.textContent.trim()==="Set up bank deposits"];const node=nodes.filter(tests[stage]).at(-1);if(node){node.click();stage++;if(stage===5)clearInterval(captureSetup);}},200);</script><script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script></head><body><div id="root"></div><script type="module" src="/src/index.tsx"></script></body></html>
