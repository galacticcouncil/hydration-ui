version: "3.8"

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
x-private-labels: &private-labels
  traefik.enable: "false"
  swarmpit.service.deployment.autoredeploy: "false"
x-observer-deploy: &observer-deploy
  placement: { constraints: [node.hostname == play] }
  replicas: 1
  resources:
    limits: { cpus: "2.0", memory: 4G }
    reservations: { memory: 256M }
  restart_policy: { condition: any, delay: 10s }
  labels: *private-labels
x-observer: &observer
  image: ${WATCHDOG_IMAGE:?set an immutable image digest}
  read_only: true
  volumes:
    - type: tmpfs
      target: /tmp
      tmpfs: { size: 1073741824 }
  deploy: *observer-deploy
  logging: *logging
x-observer-env: &observer-env
  ROLE: observer
  TARGET_URL: https://app.hydration.net
  REQUEST_TIMEOUT_MS: "60000"
  FETCH_CONCURRENCY: "4"
x-vpn-deploy: &vpn-deploy
  placement: { constraints: [node.hostname == play] }
  replicas: ${NORDVPN_REPLICAS:-0}
  resources:
    limits: { cpus: "1.0", memory: 384M }
    reservations: { memory: 64M }
  restart_policy: { condition: any, delay: 30s }
  labels: *private-labels
x-vpn: &vpn
  image: ${WATCHDOG_IMAGE:?set an immutable image digest}
  read_only: true
  volumes:
    - type: tmpfs
      target: /tmp
      tmpfs: { size: 67108864 }
  healthcheck:
    start_period: 2m
    interval: 30s
    timeout: 5s
    retries: 5
  deploy: *vpn-deploy
  logging: *logging
x-nord-env: &nord-env
  ROLE: nordvpn
  NORDVPN_TOKEN: ${NORDVPN_TOKEN:-}
  NORDVPN_ROTATE_SECONDS: ${NORDVPN_ROTATE_SECONDS:-3600}
x-tor: &tor
  image: ${TOR_IMAGE:?set an immutable Tor image digest}
  read_only: true
  deploy:
    placement: { constraints: [node.hostname == play] }
    replicas: 1
    resources:
      limits: { cpus: "1.0", memory: 384M }
      reservations: { memory: 64M }
    restart_policy: { condition: any, delay: 30s }
    labels: *private-labels
  logging: *logging

services:
  watchdog:
    image: ${WATCHDOG_IMAGE:?set an immutable image digest}
    environment:
      ROLE: watchdog
      TARGET_URL: https://app.hydration.net
      GITHUB_REPOSITORY: galacticcouncil/hydration-ui
      PRODUCTION_BRANCH: production
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?set a private dashboard token}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      OBSERVER_TOKEN_DIRECT: ${OBSERVER_TOKEN_DIRECT:?set an observer token}
      OBSERVER_TOKEN_TOR_DE: ${OBSERVER_TOKEN_TOR_DE:?set an observer token}
      OBSERVER_TOKEN_TOR_US: ${OBSERVER_TOKEN_TOR_US:?set an observer token}
      OBSERVER_TOKEN_NORD_1: ${OBSERVER_TOKEN_NORD_1:?set an observer token}
      OBSERVER_TOKEN_NORD_2: ${OBSERVER_TOKEN_NORD_2:?set an observer token}
      OBSERVER_TOKEN_NORD_3: ${OBSERVER_TOKEN_NORD_3:?set an observer token}
      OBSERVER_TOKEN_WIREGUARD: ${OBSERVER_TOKEN_WIREGUARD:?set an observer token}
      DISCORD_MENTION: ${DISCORD_MENTION:-}
      MULTI_NETWORK: "true"
      NORDVPN_REPLICAS: ${NORDVPN_REPLICAS:-0}
      WIREGUARD_REPLICAS: ${WIREGUARD_REPLICAS:-0}
      POLL_SECONDS: "30"
      FULL_AUDIT_SECONDS: "900"
      BROWSER_SECONDS: "300"
      ROLLOUT_GRACE_SECONDS: "900"
      RETENTION_DAYS: "90"
    volumes:
      - state:/data
      - type: tmpfs
        target: /tmp
        tmpfs: { size: 268435456 }
    read_only: true
    networks:
      [
        gateway,
        direct-control,
        tor-de-control,
        tor-us-control,
        nord-1-control,
        nord-2-control,
        nord-3-control,
        wireguard-control,
      ]
    stop_grace_period: 5m
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == play]
      resources:
        limits: { cpus: "1.0", memory: 768M }
        reservations: { memory: 128M }
      restart_policy: { condition: any, delay: 10s }
      update_config:
        { parallelism: 1, order: stop-first, failure_action: rollback }
      labels:
        traefik.enable: "true"
        traefik.docker.network: gateway
        traefik.http.routers.ui-watchdog.rule: Host(`ui-watchdog.play.hydration.cloud`)
        traefik.http.routers.ui-watchdog.entrypoints: websecure
        traefik.http.routers.ui-watchdog.tls: "true"
        traefik.http.routers.ui-watchdog.tls.certresolver: myresolver
        traefik.http.services.ui-watchdog.loadbalancer.server.port: "8080"
        swarmpit.service.deployment.autoredeploy: "false"
    logging: *logging

  # Keep the original service name so updates retain the existing direct worker.
  browser:
    <<: *observer
    environment:
      <<: *observer-env
      OBSERVER_ID: direct
      OBSERVER_TOKEN: ${OBSERVER_TOKEN_DIRECT:?set an observer token}
      EGRESS_KIND: direct
      REQUEST_TIMEOUT_MS: "20000"
      FETCH_CONCURRENCY: "6"
    networks: [direct-control, direct-egress]

  observer-tor-de:
    <<: *observer
    environment:
      <<: *observer-env
      OBSERVER_ID: tor-de
      OBSERVER_TOKEN: ${OBSERVER_TOKEN_TOR_DE:?set an observer token}
      EGRESS_KIND: tor
      PROXY_URL: socks5h://tor-de:9050
    networks: [tor-de-control, tor-de-private]
  tor-de:
    <<: *tor
    environment: { TOR_EXIT_NODES: "${TOR_EXIT_NODES_DE:-{de}}" }
    volumes:
      - tor-de-data:/data
      - type: tmpfs
        target: /tmp
        tmpfs: { size: 67108864 }
    networks: [tor-de-private, tor-de-egress]

  observer-tor-us:
    <<: *observer
    environment:
      <<: *observer-env
      OBSERVER_ID: tor-us
      OBSERVER_TOKEN: ${OBSERVER_TOKEN_TOR_US:?set an observer token}
      EGRESS_KIND: tor
      PROXY_URL: socks5h://tor-us:9050
    networks: [tor-us-control, tor-us-private]
  tor-us:
    <<: *tor
    environment: { TOR_EXIT_NODES: "${TOR_EXIT_NODES_US:-{us}}" }
    volumes:
      - tor-us-data:/data
      - type: tmpfs
        target: /tmp
        tmpfs: { size: 67108864 }
    networks: [tor-us-private, tor-us-egress]

  # All three gateways use ONE Nord account token; only their country differs.
  nord-1:
    <<: *vpn
    environment:
      <<: *nord-env
      NORDVPN_COUNTRY: ${NORDVPN_COUNTRY_1:-DE}
    networks: [nord-1-private, nord-1-egress]
  nord-2:
    <<: *vpn
    environment:
      <<: *nord-env
      NORDVPN_COUNTRY: ${NORDVPN_COUNTRY_2:-US}
    networks: [nord-2-private, nord-2-egress]
  nord-3:
    <<: *vpn
    environment:
      <<: *nord-env
      NORDVPN_COUNTRY: ${NORDVPN_COUNTRY_3:-SG}
    networks: [nord-3-private, nord-3-egress]
  observer-nord-1:
    <<: *observer
    environment:
      <<: *observer-env
      OBSERVER_ID: nord-1
      OBSERVER_TOKEN: ${OBSERVER_TOKEN_NORD_1:?set an observer token}
      EGRESS_KIND: proxy
      PROXY_URL: socks5h://nord-1:9050
    deploy:
      <<: *observer-deploy
      replicas: ${NORDVPN_REPLICAS:-0}
    networks: [nord-1-control, nord-1-private]
  observer-nord-2:
    <<: *observer
    environment:
      <<: *observer-env
      OBSERVER_ID: nord-2
      OBSERVER_TOKEN: ${OBSERVER_TOKEN_NORD_2:?set an observer token}
      EGRESS_KIND: proxy
      PROXY_URL: socks5h://nord-2:9050
    deploy:
      <<: *observer-deploy
      replicas: ${NORDVPN_REPLICAS:-0}
    networks: [nord-2-control, nord-2-private]
  observer-nord-3:
    <<: *observer
    environment:
      <<: *observer-env
      OBSERVER_ID: nord-3
      OBSERVER_TOKEN: ${OBSERVER_TOKEN_NORD_3:?set an observer token}
      EGRESS_KIND: proxy
      PROXY_URL: socks5h://nord-3:9050
    deploy:
      <<: *observer-deploy
      replicas: ${NORDVPN_REPLICAS:-0}
    networks: [nord-3-control, nord-3-private]

  wireguard:
    <<: *vpn
    environment:
      ROLE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY:-}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY:-}
      WIREGUARD_ENDPOINT: ${WIREGUARD_ENDPOINT:-}
      WIREGUARD_ADDRESS: ${WIREGUARD_ADDRESS:-}
      WIREGUARD_DNS: ${WIREGUARD_DNS:-1.1.1.1}
    deploy:
      <<: *vpn-deploy
      replicas: ${WIREGUARD_REPLICAS:-0}
    networks: [wireguard-private, wireguard-egress]
  observer-wireguard:
    <<: *observer
    environment:
      <<: *observer-env
      OBSERVER_ID: wireguard
      OBSERVER_TOKEN: ${OBSERVER_TOKEN_WIREGUARD:?set an observer token}
      EGRESS_KIND: proxy
      PROXY_URL: socks5h://wireguard:9050
      EXPECTED_EXIT_IP: ${WIREGUARD_EXPECTED_EXIT_IP:-}
    deploy:
      <<: *observer-deploy
      replicas: ${WIREGUARD_REPLICAS:-0}
    networks: [wireguard-control, wireguard-private]

networks:
  gateway:
    external: true
  direct-control: { driver: overlay, internal: true }
  direct-egress: { driver: overlay }
  tor-de-control: { driver: overlay, internal: true }
  tor-de-egress: { driver: overlay }
  tor-us-control: { driver: overlay, internal: true }
  tor-us-egress: { driver: overlay }
  nord-1-control: { driver: overlay, internal: true }
  nord-1-egress: { driver: overlay }
  nord-2-control: { driver: overlay, internal: true }
  nord-2-egress: { driver: overlay }
  nord-3-control: { driver: overlay, internal: true }
  nord-3-egress: { driver: overlay }
  wireguard-control: { driver: overlay, internal: true }
  wireguard-egress: { driver: overlay }
  tor-de-private: { driver: overlay, internal: true }
  tor-us-private: { driver: overlay, internal: true }
  nord-1-private: { driver: overlay, internal: true }
  nord-2-private: { driver: overlay, internal: true }
  nord-3-private: { driver: overlay, internal: true }
  wireguard-private: { driver: overlay, internal: true }

volumes:
  state: { driver: local }
  tor-de-data: { driver: local }
  tor-us-data: { driver: local }
