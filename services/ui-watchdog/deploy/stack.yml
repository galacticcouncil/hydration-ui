version: "3.8"

services:
  watchdog:
    image: ${WATCHDOG_IMAGE:?set an immutable image digest}
    environment:
      ROLE: watchdog
      TARGET_URL: https://app.hydration.net
      GITHUB_REPOSITORY: galacticcouncil/hydration-ui
      PRODUCTION_BRANCH: production
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_MENTION: ${DISCORD_MENTION:-}
      BROWSER_URL: http://browser:8080
      POLL_SECONDS: "30"
      FULL_AUDIT_SECONDS: "300"
      BROWSER_SECONDS: "300"
      ROLLOUT_GRACE_SECONDS: "900"
      RETENTION_DAYS: "90"
    volumes:
      - state:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - gateway
      - probe
    stop_grace_period: 2m
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == play
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      labels:
        traefik.enable: "true"
        traefik.docker.network: gateway
        traefik.http.routers.ui-watchdog.rule: Host(`ui-watchdog.play.hydration.cloud`)
        traefik.http.routers.ui-watchdog.entrypoints: websecure
        traefik.http.routers.ui-watchdog.tls: "true"
        traefik.http.routers.ui-watchdog.tls.certresolver: myresolver
        traefik.http.services.ui-watchdog.loadbalancer.server.port: "8080"
        swarmpit.service.deployment.autoredeploy: "false"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  browser:
    image: ${WATCHDOG_IMAGE:?set an immutable image digest}
    environment:
      ROLE: browser
      TARGET_URL: https://app.hydration.net
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    networks:
      - probe
      - egress
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 256M
      restart_policy:
        condition: any
        delay: 10s
      labels:
        traefik.enable: "false"
        swarmpit.service.deployment.autoredeploy: "false"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  gateway:
    external: true
  probe:
    driver: overlay
    internal: true
  egress:
    driver: overlay

volumes:
  state:
    driver: local
