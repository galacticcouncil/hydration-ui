name: UI watchdog checks
on:
  push:
    paths: [services/ui-watchdog/**, .github/workflows/ui-watchdog*.yml]
  pull_request:
    paths: [services/ui-watchdog/**, .github/workflows/ui-watchdog*.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    defaults:
      run:
        working-directory: services/ui-watchdog
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:browser
