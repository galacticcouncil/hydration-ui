name: e2e
on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: yarn
          node-version-file: ".nvmrc"
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: npx e2e-web install chromium --with-deps
      - name: Run e2e
        run: |
          [ -n "$OPENROUTER_API_KEY" ] || set -- --exclude-tag agentic
          yarn test:e2e --retries 0 "$@" || yarn test:e2e --last-failed --retries 0 "$@"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: .e2e/results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            .e2e/report.json
            .e2e/logs/
          if-no-files-found: ignore
          retention-days: 14
